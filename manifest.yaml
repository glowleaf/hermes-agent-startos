id: hermes-agent
title: Hermes Agent
version: 0.1.1.0
release-notes: |
  Adds StartOS Config support (provider/model/api key/toggles) and wrapper repo updates.
license: MIT
wrapper-repo: https://github.com/glowleaf/hermes-agent-startos
upstream-repo: https://github.com/NousResearch/hermes-agent
support-site: https://hermes-agent.nousresearch.com/docs/
marketing-site: https://hermes-agent.nousresearch.com/
donation-url: null
build:
  - sh
  - -c
  - "true"
description:
  short: Hermes Agent Web UI for StartOS
  long: Hermes Agent with web dashboard on port 8787.
assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md
  docker-images: image.tar
main:
  type: docker
  image: start9/hermes-agent
  system: false
  entrypoint: /usr/local/bin/entrypoint.sh
  args: []
  inject: false
  mounts:
    main: /data
health-checks:
  web-ui:
    name: Web UI
    success-message: Hermes dashboard is ready
    type: docker
    image: start9/hermes-agent
    system: false
    entrypoint: /usr/local/bin/health-check.sh
    args: []
    inject: true
    mounts: {}
interfaces:
  main:
    name: Web UI
    description: Hermes Agent dashboard
    tor-config:
      port-mapping:
        "8787": "8787"
    lan-config:
      "8787":
        ssl: false
        internal: 8787
    ui: true
    protocols:
      - tcp
      - http
config:
  get:
    type: script
  set:
    type: script
properties:
  type: script
backup:
  create:
    type: docker
    image: start9/hermes-agent
    system: false
    entrypoint: /usr/local/bin/backup.sh
    args: []
    inject: false
    mounts:
      main: /data
  restore:
    type: docker
    image: start9/hermes-agent
    system: false
    entrypoint: /usr/local/bin/restore.sh
    args: []
    inject: false
    mounts:
      main: /data
migrations:
  from:
    "*":
      type: docker
      image: start9/hermes-agent
      system: false
      entrypoint: /usr/local/bin/migrate.sh
      args: ["from", "*"]
      inject: false
      mounts:
        main: /data
      io-format: json
  to:
    "*":
      type: docker
      image: start9/hermes-agent
      system: false
      entrypoint: /usr/local/bin/migrate.sh
      args: ["to", "*"]
      inject: false
      mounts:
        main: /data
      io-format: json
volumes:
  main:
    type: data
alerts:
  install: null
  update: null
  uninstall: null
  restore: null
  start: null
  stop: null
dependencies: {}
actions:
  update-upstream:
    name: Update Hermes Agent
    description: Pull the latest Hermes source from Nous Research (upstream) and rebuild
    warning: This will update the Hermes Agent software to the latest upstream version from https://github.com/NousResearch/hermes-agent
    allowed: true
    type: docker
    image: start9/hermes-agent
    system: false
    entrypoint: /usr/local/bin/update-upstream.sh
    args: []
    inject: false
    mounts:
      main: /data
replaces: []
hardware-requirements:
  device: {}
  ram: null
  arch: null
